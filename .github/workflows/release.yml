name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Forçar criação de release mesmo sem alteração de versão'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-version:
    name: Verificar Versão e Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se há nova versão
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "Release disparada diretamente pela tag: $TAG"
          else
            VERSION=$(jq -r .version desktop/package.json)
            TAG="v$VERSION"
            echo "Versão detectada no package.json: $VERSION"

            if git rev-parse "$TAG" >/dev/null 2>&1 && [ "${{ github.event.inputs.force_release }}" != "true" ]; then
              echo "Tag $TAG já existe no repositório. Nenhuma nova versão para publicar."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Nova versão detectada para publicação: $VERSION ($TAG)"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-linux:
    name: Build Linux (AppImage & tar.gz)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências de sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libx11-dev libxi-dev libxtst-dev libxrandr-dev libxcursor-dev libxinerama-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: map-check

      - name: Compilar map-check em Rust (Linux)
        working-directory: map-check
        run: cargo build --profile electron

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências do Desktop
        working-directory: desktop
        run: npm ci

      - name: Empacotar binário único Linux
        working-directory: desktop
        run: npm run dist:linux

      - name: Upload de artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.zsync
            desktop/dist/latest-linux.yml
          if-no-files-found: warn

  build-windows:
    name: Build Windows (.exe Portable)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: map-check

      - name: Compilar map-check em Rust (Windows)
        working-directory: map-check
        run: cargo build --profile electron

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências do Desktop
        working-directory: desktop
        run: npm ci

      - name: Empacotar executável único Windows
        working-directory: desktop
        run: npm run dist:win

      - name: Upload de artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: desktop/dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Publicar Release no GitHub
    needs: [check-version, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-assets

      - name: Baixar artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Criar Git Tag se não existir
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: DBD Tracker Overlay ${{ needs.check-version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
